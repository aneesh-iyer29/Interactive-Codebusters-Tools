<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codebusters Practice</title>
  <style>
    :root {
      --bg: #f4f2ee;
      --card: #ffffff;
      --word: #ecebe7;
      --border: #d6d3cc;
      --text: #22201c;
      --muted: #77736b;
      --accent: #2f6fb0;
      --accent-ink: #ffffff;
      --cell: #ffffff;
      --cell-border: #a9a49a;
      --focus: #ffd84d;
      --match: #fff1b0;
      --conflict: #c62828;
      --conflict-bg: #fde4e4;
      --used: #c9c5bd;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;
        --card: #212225;
        --word: #2b2d31;
        --border: #3a3c41;
        --text: #ecebe8;
        --muted: #9a9890;
        --accent: #5b9be0;
        --accent-ink: #0d1117;
        --cell: #17181a;
        --cell-border: #5a5c62;
        --focus: #b8962a;
        --match: #4a4122;
        --conflict: #ff8a80;
        --conflict-bg: #4a2323;
        --used: #4a4c52;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 var(--sans);
    }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 10px; letter-spacing: -0.01em; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    /* ---------- input ---------- */
    #cipherInput {
      width: 100%;
      min-height: 64px;
      padding: 8px 10px;
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--text);
      background: var(--cell);
      border: 1px solid var(--border);
      border-radius: 6px;
      resize: vertical;
    }
    #cipherInput:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      margin-top: 8px;
    }
    .controls label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
    .controls select {
      font: inherit;
      color: var(--text);
      background: var(--cell);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 6px;
    }
    .controls input[type=checkbox] { margin: 0; accent-color: var(--accent); }
    .btn {
      font: inherit;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--cell);
      color: var(--text);
      cursor: pointer;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn:hover { filter: brightness(0.96); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .spacer { flex: 1; }
    .hint { color: var(--muted); font-size: 12px; }

    /* ---------- puzzle grid ---------- */
    #puzzle[hidden], #tableCard[hidden] { display: none; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px 10px;
    }
    .line-break { flex-basis: 100%; height: 0; margin-bottom: -8px; }
    .line-break.blank { height: 14px; }
    .word {
      display: inline-flex;
      flex-wrap: wrap;
      max-width: 100%;
      align-items: flex-start;
      background: var(--word);
      border-radius: 4px;
      padding: 3px 3px 2px;
      gap: 2px;
    }
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 26px;
    }
    .cell input {
      width: 26px;
      height: 28px;
      padding: 0;
      text-align: center;
      font: 600 17px/1 var(--serif);
      text-transform: uppercase;
      color: var(--accent);
      background: var(--cell);
      border: 1px solid var(--cell-border);
      border-radius: 3px;
      caret-color: transparent;
    }
    .cell input:focus { outline: none; }
    .cell .ct { font: 15px/1.15 var(--serif); margin-top: 2px; }
    .cell .fq { font-size: 10px; line-height: 1.1; color: var(--muted); }
    .hide-freq .cell .fq { display: none; }
    .punct {
      align-self: flex-start;
      width: auto;
      min-width: 8px;
      padding-top: 30px;
      font: 15px/1.15 var(--serif);
      color: var(--muted);
    }

    .match { background: var(--match) !important; }
    .active { background: var(--focus) !important; }
    .conflict { color: var(--conflict) !important; }
    .cell input.conflict { background: var(--conflict-bg); }
    .conflict.active, .conflict.match { box-shadow: inset 0 0 0 2px var(--conflict); }


    /* ---------- frequency table ---------- */
    .table-wrap { overflow-x: auto; }
    table {
      border-collapse: collapse;
      width: 100%;
      text-align: center;
      font-size: 13px;
    }
    th, td { border: 1px solid var(--border); padding: 0; height: 26px; min-width: 24px; }
    th.rowlbl {
      text-align: left;
      padding: 0 8px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      background: var(--word);
    }
    tr.letters th:not(.rowlbl) { background: var(--word); font: 600 15px var(--serif); }
    tr.counts td { color: var(--muted); }
    table input {
      width: 100%;
      height: 26px;
      border: 0;
      padding: 0;
      text-align: center;
      font: 600 15px var(--serif);
      text-transform: uppercase;
      color: var(--accent);
      background: transparent;
      caret-color: transparent;
    }
    table input:focus { outline: none; }

    @media (max-width: 600px) {
      main { padding: 12px 16px; }
      .cell, .cell input { width: 23px; }
      .cell input { height: 26px; font-size: 15px; }
    }
  </style>
</head>
<body>
<main>
  <h1>Codebusters Practice</h1>

  <section class="card">
    <textarea id="cipherInput" rows="3" spellcheck="false"
      placeholder="Paste or type your ciphertext here (Ctrl+Enter to load)"></textarea>
    <div class="controls">
      <label>Cipher
        <select id="cipherType">
          <option value="Aristocrat">Aristocrat</option>
          <option value="Xenocrypt">Xenocrypt</option>
        </select>
      </label>
      <label>Alphabet
        <select id="alphaType">
          <option value="K1">K1</option>
          <option value="K2">K2</option>
        </select>
      </label>
      <label><input type="checkbox" id="autofillToggle"> Autofill</label>
      <label><input type="checkbox" id="preserveLinesToggle"> Keep line breaks</label>
      <label><input type="checkbox" id="freqToggle" checked> Letter counts</label>
      <span class="spacer"></span>
      <button class="btn" id="clearButton" type="button">Clear answers</button>
      <button class="btn primary" id="loadButton" type="button">Load cipher</button>
    </div>
  </section>

  <section class="card" id="puzzle" hidden>
    <div class="grid" id="gridContainer"></div>
  </section>

  <section class="card" id="tableCard" hidden>
    <div class="table-wrap" id="frequencyTableContainer"></div>
  </section>
</main>

<script>
(() => {
  const EN = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
  const ES = [...'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'];

  const $ = (id) => document.getElementById(id);
  const els = {
    input: $('cipherInput'),
    type: $('cipherType'),
    alpha: $('alphaType'),
    autofill: $('autofillToggle'),
    lines: $('preserveLinesToggle'),
    freq: $('freqToggle'),
    grid: $('gridContainer'),
    table: $('frequencyTableContainer'),
    puzzle: $('puzzle'),
    tableCard: $('tableCard'),
  };

  // ---- state ----
  let letters = EN;          // alphabet for current puzzle
  let alphaType = 'K1';
  let autofill = false;
  let cells = [];            // [{ cipher, input }]
  let kInputs = [];          // table inputs (K1: keyed by cipher, K2: keyed by plain)
  let k2Counts = [];         // K2 only: count cells under each table input
  let freq = {};
  let map = {};              // autofill mode: cipher letter -> plain letter
  let hoverEl = null;

  // ---- persisted preferences (best effort) ----
  const PREF_KEY = 'cb-practice-prefs';
  function loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
      if (p.type) els.type.value = p.type;
      if (p.alpha) els.alpha.value = p.alpha;
      if (typeof p.autofill === 'boolean') els.autofill.checked = p.autofill;
      if (typeof p.lines === 'boolean') els.lines.checked = p.lines;
      if (typeof p.freq === 'boolean') els.freq.checked = p.freq;
    } catch (_) {}
  }
  function savePrefs() {
    try {
      localStorage.setItem(PREF_KEY, JSON.stringify({
        type: els.type.value, alpha: els.alpha.value,
        autofill: els.autofill.checked, lines: els.lines.checked, freq: els.freq.checked,
      }));
    } catch (_) {}
  }

  // Normalize a typed character to an alphabet letter, or '' if not allowed.
  function toLetter(ch) {
    if (!ch) return '';
    const up = ch.normalize('NFC').toUpperCase();
    return letters.includes(up) ? up : '';
  }

  // ---- parsing ----
  // Returns lines -> words -> tokens ({t:'L', ch} | {t:'P', ch})
  function parse(text, keepLines) {
    text = text.normalize('NFC');
    const rawLines = keepLines ? text.replace(/\r\n?/g, '\n').split('\n') : [text];
    // trim leading/trailing blank lines
    while (rawLines.length && !rawLines[0].trim()) rawLines.shift();
    while (rawLines.length && !rawLines[rawLines.length - 1].trim()) rawLines.pop();
    return rawLines.map(line =>
      line.split(/\s+/).filter(Boolean).map(word =>
        [...word].map(ch => {
          const up = ch.toUpperCase();
          return letters.includes(up) ? { t: 'L', ch: up } : { t: 'P', ch };
        })
      )
    );
  }

  // ---- building ----
  function build() {
    const text = els.input.value || '';
    if (!text.trim()) return;

    letters = els.type.value === 'Xenocrypt' ? ES : EN;
    alphaType = els.alpha.value;
    autofill = els.autofill.checked;

    const lines = parse(text, els.lines.checked);
    map = {};
    hoverEl = null;

    freq = {};
    letters.forEach(l => (freq[l] = 0));
    lines.flat(2).forEach(tok => { if (tok.t === 'L') freq[tok.ch]++; });

    cells = [];
    els.grid.innerHTML = '';
    lines.forEach((words, li) => {
      if (li > 0) {
        const br = document.createElement('div');
        br.className = 'line-break' + (words.length ? '' : ' blank');
        els.grid.appendChild(br);
      }
      words.forEach(tokens => {
        const w = document.createElement('div');
        w.className = 'word';
        tokens.forEach(tok => {
          if (tok.t === 'P') {
            const p = document.createElement('div');
            p.className = 'cell punct';
            p.textContent = tok.ch;
            w.appendChild(p);
            return;
          }
          const c = document.createElement('div');
          c.className = 'cell';
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.autocomplete = 'off';
          inp.setAttribute('autocapitalize', 'characters');
          inp.spellcheck = false;
          inp.dataset.cipher = tok.ch;
          inp.setAttribute('aria-label', 'Plaintext for ' + tok.ch);
          const ct = document.createElement('div');
          ct.className = 'ct';
          ct.textContent = tok.ch;
          const fq = document.createElement('div');
          fq.className = 'fq';
          fq.textContent = freq[tok.ch];
          c.append(inp, ct, fq);
          w.appendChild(c);
          cells.push({ cipher: tok.ch, input: inp });
        });
        els.grid.appendChild(w);
      });
    });

    cells.forEach((cell, idx) => wireGridInput(cell.input, idx));
    buildTable();
    applyFreqVisibility();
    els.puzzle.hidden = false;
    els.tableCard.hidden = false;
    refresh();
    if (cells.length) cells[0].input.focus();
  }

  function buildTable() {
    kInputs = [];
    k2Counts = [];
    const table = document.createElement('table');
    const row = (cls, label) => {
      const tr = document.createElement('tr');
      if (cls) tr.className = cls;
      const th = document.createElement('th');
      th.className = 'rowlbl';
      th.scope = 'row';
      th.textContent = label;
      tr.appendChild(th);
      return tr;
    };
    const makeInput = (letter) => {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.autocomplete = 'off';
      inp.setAttribute('autocapitalize', 'characters');
      inp.spellcheck = false;
      inp.dataset.key = letter;
      td.appendChild(inp);
      kInputs.push(inp);
      return td;
    };

    if (alphaType === 'K1') {
      // Ciphertext alphabet + counts, write plaintext underneath.
      const rLetters = row('letters', 'Cipher');
      const rCounts = row('counts', 'Frequency');
      const rPlain = row('', 'Plain');
      letters.forEach(l => {
        const th = document.createElement('th'); th.textContent = l; rLetters.appendChild(th);
        const td = document.createElement('td'); td.textContent = freq[l] || ''; rCounts.appendChild(td);
        const inp = makeInput(l);
        rPlain.appendChild(inp);
      });
      table.append(rLetters, rCounts, rPlain);
    } else {
      // K2: plaintext alphabet, write the ciphertext letter above it.
      // Frequency row shows the count of whatever cipher letter was entered.
      const rCipher = row('', 'Cipher');
      const rCounts = row('counts', 'Frequency');
      const rPlain = row('letters', 'Plain');
      letters.forEach(l => {
        rCipher.appendChild(makeInput(l));
        const td = document.createElement('td'); rCounts.appendChild(td); k2Counts.push(td);
        const th = document.createElement('th'); th.textContent = l; rPlain.appendChild(th);
      });
      table.append(rCipher, rCounts, rPlain);
    }

    els.table.innerHTML = '';
    els.table.appendChild(table);
    kInputs.forEach((inp, idx) => wireTableInput(inp, idx));
  }

  function applyFreqVisibility() {
    els.puzzle.classList.toggle('hide-freq', !els.freq.checked);
  }

  // ---- mapping logic ----
  // Cipher letter shown in the table input (K2) / plain letter (K1).
  function cipherForTableInput(inp) {
    return alphaType === 'K1' ? inp.dataset.key : (inp.value || '');
  }

  // Autofill: record cipher -> plain, then redraw grid + table from the map.
  function setMapping(cipher, plain) {
    if (!cipher) return;
    if (plain) map[cipher] = plain; else delete map[cipher];
    renderFromMap();
  }

  function renderFromMap() {
    cells.forEach(c => { c.input.value = map[c.cipher] || ''; });
    if (alphaType === 'K1') {
      kInputs.forEach(k => { k.value = map[k.dataset.key] || ''; });
    } else {
      // Each plain column shows the cipher letter mapped to it (first one if several).
      kInputs.forEach(k => {
        const c = letters.find(l => map[l] === k.dataset.key);
        k.value = c || '';
      });
    }
  }

  // When autofill is switched on, link up whatever was already entered.
  function reconcileMap() {
    map = {};
    cells.forEach(c => { if (c.input.value && !map[c.cipher]) map[c.cipher] = c.input.value; });
    kInputs.forEach(k => {
      if (!k.value) return;
      if (alphaType === 'K1') { if (!map[k.dataset.key]) map[k.dataset.key] = k.value; }
      else if (!map[k.value]) map[k.value] = k.dataset.key;
    });
    renderFromMap();
  }

  // Write into a grid cell.
  function writeGrid(idx, plain) {
    const cell = cells[idx];
    if (autofill) setMapping(cell.cipher, plain);
    else cell.input.value = plain;
    refresh();
  }

  // Write into a table cell.
  function writeTable(inp, val) {
    if (!autofill) { inp.value = val; refresh(); return; }
    if (alphaType === 'K1') {
      setMapping(inp.dataset.key, val);
    } else {
      const plain = inp.dataset.key;
      const old = inp.value;
      if (old && old !== val && map[old] === plain) delete map[old];
      if (val) map[val] = plain;
      renderFromMap();
    }
    refresh();
  }

  // Recompute conflicts and K2 counts.
  function refresh() {
    // plain letter -> set of cipher letters that map to it (from grid)
    const usedBy = {};
    cells.forEach(c => {
      const v = c.input.value;
      if (!v) return;
      (usedBy[v] = usedBy[v] || new Set()).add(c.cipher);
    });

    // Conflicts only make sense when letters are linked (autofill mode).
    cells.forEach(c => {
      const v = c.input.value;
      c.input.classList.toggle('conflict', autofill && !!v && usedBy[v].size > 1);
    });
    if (alphaType === 'K1') {
      kInputs.forEach(k => {
        const v = k.value;
        k.classList.toggle('conflict', autofill && !!v &&
          kInputs.some(o => o !== k && o.value === v));
      });
    } else {
      kInputs.forEach((k, i) => {
        const v = k.value;
        k2Counts[i].textContent = v ? (freq[v] || 0) : '';
        const multi = letters.filter(l => map[l] === k.dataset.key).length > 1;
        k.classList.toggle('conflict', autofill && !!v &&
          (multi || kInputs.some(o => o !== k && o.value === v)));
      });
    }
  }

  // ---- highlighting ----
  function clearHighlights() {
    document.querySelectorAll('.match, .active').forEach(n => n.classList.remove('match', 'active'));
  }
  function highlightFor(el) {
    clearHighlights();
    if (!el) return;
    const isTable = !!el.dataset.key;
    const cipher = isTable ? cipherForTableInput(el) : el.dataset.cipher;
    if (autofill && cipher) {
      cells.forEach(c => { if (c.cipher === cipher) c.input.classList.add('match'); });
      const k = alphaType === 'K1'
        ? kInputs.find(k => k.dataset.key === cipher)
        : kInputs.find(k => k.value === cipher);
      if (k) k.classList.add('match');
    }
    el.classList.add('active');
  }
  function rehighlight() {
    const a = document.activeElement;
    if (a && (a.dataset.cipher || a.dataset.key)) highlightFor(a);
    else if (hoverEl) highlightFor(hoverEl);
    else clearHighlights();
  }

  // ---- navigation helpers ----
  function focusCell(idx) {
    if (idx >= 0 && idx < cells.length) cells[idx].input.focus();
  }
  function focusTable(idx) {
    if (idx >= 0 && idx < kInputs.length) kInputs[idx].focus();
  }
  // Next cell that is still empty (when autofill), else just next cell.
  function nextGridIdx(idx) {
    if (autofill) {
      for (let n = 1; n < cells.length; n++) {
        const i = (idx + n) % cells.length;
        if (!cells[i].input.value) return i;
      }
    }
    return Math.min(idx + 1, cells.length - 1);
  }

  // Shared key handling for any single-letter input.
  function wireLetterInput(inp, { write, moveNext, movePrev, moveBy }) {
    // Typed characters (works with mobile keyboards too, since we read the value)
    const onInput = (e) => {
      if (e.isComposing) return; // wait for compositionend (dead keys, IMEs)
      const raw = inp.value;
      const prev = inp.dataset.prev || '';
      // Android keyboards report Backspace/Delete only through input events.
      if (e.inputType && e.inputType.startsWith('delete')) {
        inp.value = prev;
        if (prev) write('');
        rehighlight();
        return;
      }
      // Work out what was just inserted, wherever the caret was.
      let typed = raw;
      if (prev && raw.length > prev.length) {
        if (raw.startsWith(prev)) typed = raw.slice(prev.length);
        else if (raw.endsWith(prev)) typed = raw.slice(0, raw.length - prev.length);
      }
      const last = typed.slice(-1);
      inp.value = prev;
      if (last === ' ') { write(''); moveNext(true); rehighlight(); return; }
      const letter = toLetter(last);
      if (!letter) return;
      write(letter);
      moveNext();
      rehighlight();
    };
    inp.addEventListener('input', onInput);
    inp.addEventListener('compositionend', () => onInput({ isComposing: false }));
    inp.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      switch (e.key) {
        case 'Backspace':
          e.preventDefault();
          if (inp.value) { write(''); }
          else { movePrev(true); }
          break;
        case 'Delete':
        case ' ':
          e.preventDefault();
          write('');
          if (e.key === ' ') moveNext(true);
          break;
        case 'ArrowLeft': e.preventDefault(); moveBy(-1); break;
        case 'ArrowRight': e.preventDefault(); moveBy(1); break;
        default: return;
      }
      rehighlight();
    });
    inp.addEventListener('focus', () => { highlightFor(inp); requestAnimationFrame(() => inp.setSelectionRange(0, inp.value.length)); });
    inp.addEventListener('blur', () => requestAnimationFrame(rehighlight));
    inp.addEventListener('mouseenter', () => { hoverEl = inp; if (!document.activeElement || !(document.activeElement.dataset.cipher || document.activeElement.dataset.key)) highlightFor(inp); });
    inp.addEventListener('mouseleave', () => { if (hoverEl === inp) hoverEl = null; rehighlight(); });
  }

  function syncPrev() {
    cells.forEach(c => (c.input.dataset.prev = c.input.value));
    kInputs.forEach(k => (k.dataset.prev = k.value));
  }

  function wireGridInput(inp, idx) {
    wireLetterInput(inp, {
      write: (v) => { writeGrid(idx, v); syncPrev(); },
      moveNext: (plain) => focusCell(plain ? idx + 1 : nextGridIdx(idx)),
      movePrev: (clearPrev) => {
        if (idx === 0) return;
        focusCell(idx - 1);
        if (clearPrev) { writeGrid(idx - 1, ''); syncPrev(); }
      },
      moveBy: (d) => focusCell(idx + d),
    });
  }

  function wireTableInput(inp, idx) {
    wireLetterInput(inp, {
      write: (v) => { writeTable(inp, v); syncPrev(); },
      moveNext: () => focusTable(idx + 1),
      movePrev: (clearPrev) => {
        if (idx === 0) return;
        focusTable(idx - 1);
        if (clearPrev) { writeTable(kInputs[idx - 1], ''); syncPrev(); }
      },
      moveBy: (d) => focusTable(idx + d),
    });
  }

  // ---- controls ----
  els.autofill.addEventListener('change', () => {
    autofill = els.autofill.checked;
    savePrefs();
    if (autofill) { reconcileMap(); syncPrev(); }
    refresh();
    rehighlight();
  });
  els.freq.addEventListener('change', () => { applyFreqVisibility(); savePrefs(); });
  [els.type, els.alpha, els.lines].forEach(el => el.addEventListener('change', savePrefs));
  $('loadButton').addEventListener('click', build);
  $('clearButton').addEventListener('click', () => {
    map = {};
    cells.forEach(c => (c.input.value = ''));
    kInputs.forEach(k => (k.value = ''));
    syncPrev();
    refresh();
    clearHighlights();
  });
  els.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); build(); }
  });

  loadPrefs();
})();
</script>
</body>
</html>
